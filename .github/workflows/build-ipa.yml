name: Build Metro IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: bash build.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Subway Tools
          path: build/Subway Tools 1.0.0.ipa
          if-no-files-found: error
