name: Build Metro IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: bash build.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beijing-Subway-motion-1.0.2-unsigned
          path: build/Beijing-Subway-motion-1.0.2-unsigned.ipa
          if-no-files-found: error
