name: Build Metro IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: bash build.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Convenient-transportation-1.0.3-unsigned
          path: build/Convenient-transportation-1.0.3-unsigned.ipa
          if-no-files-found: error
